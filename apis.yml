name: BetterDoctor
description: BetterDoctor Inc. was a San Francisco health-technology company (founded 2012) that built a
  provider data verification and directory-accuracy platform, helping health plans keep their provider
  directories current while letting clinicians attest to and manage their own practice information. Its
  original public API surfaced physician, practice-location, specialty, and insurance-plan data for building
  healthcare provider-directory applications. Backed by 500 Global and Uncork Capital, BetterDoctor was
  acquired by Quest Analytics, where the product continues as a provider-attestation and network-adequacy
  service used by 700,000+ healthcare professionals across 360,000+ locations. The standalone developer API
  has since been retired; betterdoctor.com now redirects to Quest Analytics.
